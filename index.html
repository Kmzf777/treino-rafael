<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171B21">
<title>Treino Rafael — academia + 5km</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,75..125,400..800;1,75..125,400..700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#171B21;
    --surface:#1E242C;
    --surface-2:#252D36;
    --line:#333D48;
    --text:#E9ECE9;
    --muted:#93A1AE;
    --quad:#E8833A;
    --post:#A78BFA;
    --run:#46C08B;
    --circ:#4FA8E8;
    --warm:#B9C2CB;
    --alert:#E4574C;
    --accent:var(--quad);
    --r:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Archivo',system-ui,-apple-system,sans-serif;
    font-variation-settings:'wdth' 100;
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding-bottom:96px;
  }
  a{color:inherit}
  button{font-family:inherit;color:inherit;cursor:pointer}
  .wrap{max-width:720px;margin:0 auto;padding:0 16px}

  /* ---------- header ---------- */
  header{
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#1C222A,#171B21);
  }
  .head-top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:20px 0 14px}
  h1{
    margin:0;
    font-size:30px;
    line-height:1.02;
    font-weight:800;
    font-variation-settings:'wdth' 88;
    letter-spacing:-.015em;
  }
  h1 span{display:block;font-size:13px;font-weight:500;font-variation-settings:'wdth' 100;letter-spacing:0;color:var(--muted);margin-top:6px}
  .modeswitch{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
  .modeswitch button{background:none;border:0;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--muted)}
  .modeswitch button[aria-pressed="true"]{background:var(--surface-2);color:var(--text)}

  nav{display:flex;gap:6px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:none;max-width:720px;margin:0 auto}
  nav::-webkit-scrollbar{display:none}
  nav button{
    flex:none;background:none;border:1px solid var(--line);border-radius:999px;
    padding:8px 15px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap;
  }
  nav button[aria-current="true"]{background:var(--tabcol,var(--text));border-color:transparent;color:#12161A}

  /* ---------- panels ---------- */
  .panel{display:none;padding-top:22px}
  .panel.on{display:block}
  h2{
    font-size:21px;margin:0 0 4px;font-weight:700;font-variation-settings:'wdth' 92;letter-spacing:-.01em;
  }
  .lede{color:var(--muted);font-size:14.5px;margin:0 0 20px;max-width:60ch}

  .block{margin:0 0 26px}
  .block-head{
    display:flex;align-items:baseline;gap:10px;
    padding:0 0 8px;border-bottom:2px solid var(--accent);margin-bottom:2px;
  }
  .block-head h3{margin:0;font-size:15px;font-weight:700;letter-spacing:.01em}
  .block-head em{font-style:normal;color:var(--muted);font-size:13px;font-weight:500}

  /* ---------- exercise rows ---------- */
  .ex{border-bottom:1px solid var(--line)}
  .ex-top{
    display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;
    width:100%;background:none;border:0;text-align:left;padding:13px 2px 13px 0;
  }
  .tick{
    width:24px;height:24px;border:1.5px solid var(--line);border-radius:7px;flex:none;
    background:none;display:grid;place-items:center;padding:0;
  }
  .tick svg{width:14px;height:14px;opacity:0;stroke:#12161A;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .ex.done .tick{background:var(--accent);border-color:var(--accent)}
  .ex.done .tick svg{opacity:1}
  .ex.done .ex-name{color:var(--muted)}
  .ex-name{font-size:16px;font-weight:600;line-height:1.25;display:block}
  .ex-name .uni{
    display:inline-block;vertical-align:2px;margin-left:7px;font-size:10.5px;font-weight:700;
    color:var(--accent);border:1px solid currentColor;border-radius:4px;padding:0 4px;line-height:15px;
  }
  .ex-sets{display:block;font-size:13.5px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
  .chev{width:11px;height:11px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-right:4px;transition:transform .18s}
  .ex.open .chev{transform:rotate(-135deg)}

  .ex-body{display:none;padding:2px 0 20px}
  .ex.open .ex-body{display:block}

  .video{
    position:relative;width:100%;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;
    background:var(--surface);border:1px solid var(--line);display:block;padding:0;border-width:1px;
  }
  .video img{width:100%;height:100%;object-fit:cover;display:block;opacity:.72}
  .video iframe{width:100%;height:100%;border:0;display:block}
  .play{
    position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,rgba(10,13,16,.1),rgba(10,13,16,.55));
  }
  .play span{
    background:var(--text);color:#12161A;border-radius:999px;padding:9px 18px;font-size:14px;font-weight:700;
    display:inline-flex;align-items:center;gap:8px;
  }
  .play span::before{content:"";width:0;height:0;border-left:9px solid #12161A;border-top:6px solid transparent;border-bottom:6px solid transparent}

  .cues{margin:14px 0 0;padding:0;list-style:none}
  .cues li{
    font-size:14.5px;color:#CBD3DA;padding:0 0 0 16px;position:relative;margin-bottom:6px;line-height:1.45;
  }
  .cues li::before{content:"";position:absolute;left:0;top:9px;width:6px;height:2px;background:var(--accent)}
  .cues li.warn{color:#F0BDB8}
  .cues li.warn::before{background:var(--alert)}

  .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .links a{
    font-size:13px;font-weight:600;text-decoration:none;color:var(--muted);
    border:1px solid var(--line);border-radius:999px;padding:6px 12px;
  }
  .links a:hover{color:var(--text);border-color:var(--muted)}

  .log{
    display:flex;gap:8px;align-items:center;margin-top:14px;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;flex-wrap:wrap;
  }
  .log label{font-size:12.5px;color:var(--muted);font-weight:600}
  .log input{
    background:var(--surface-2);border:1px solid var(--line);border-radius:7px;color:var(--text);
    font-family:inherit;font-size:15px;font-weight:600;padding:7px 9px;width:88px;
    font-variant-numeric:tabular-nums;
  }
  .log input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  .saved{font-size:12.5px;color:var(--run);opacity:0;transition:opacity .2s}
  .saved.on{opacity:1}

  /* ---------- week table ---------- */
  .week{width:100%;border-collapse:collapse;margin-bottom:24px}
  .week th{
    text-align:left;font-size:12px;color:var(--muted);font-weight:700;
    padding:0 0 8px;border-bottom:1px solid var(--line);
  }
  .week td{padding:12px 0;border-bottom:1px solid var(--line);vertical-align:top;font-size:15px}
  .week td:first-child{width:92px;color:var(--muted);font-weight:600;font-size:14px}
  .week .rest td:nth-child(2){color:var(--muted)}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:8px;vertical-align:1px}

  .note{
    border-left:3px solid var(--accent);padding:2px 0 2px 14px;margin:20px 0;
    font-size:14.5px;color:#CBD3DA;
  }
  .note strong{color:var(--text)}
  .note.danger{border-color:var(--alert)}

  .cards{display:grid;gap:12px;margin:18px 0 26px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px}
  .card h4{margin:0 0 6px;font-size:15px;font-weight:700}
  .card p{margin:0;font-size:14.5px;color:#CBD3DA}

  .runtable{width:100%;border-collapse:collapse;margin:6px 0 24px;font-variant-numeric:tabular-nums}
  .runtable th{text-align:left;font-size:12px;color:var(--muted);padding:0 0 8px;border-bottom:1px solid var(--line);font-weight:700}
  .runtable td{padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
  .runtable td:first-child{width:78px;color:var(--muted);font-weight:600}
  .runtable tr.light td{color:var(--run)}

  h3.sub{font-size:16px;margin:26px 0 6px;font-weight:700}

  /* ---------- timer ---------- */
  .timerbar{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:rgba(23,27,33,.94);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  }
  .timerbar .inner{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
  .clock{
    font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;
    min-width:74px;font-variation-settings:'wdth' 88;
  }
  .clock.ring{color:var(--run)}
  .tbtn{
    background:var(--surface-2);border:1px solid var(--line);border-radius:8px;
    padding:9px 13px;font-size:13.5px;font-weight:700;
  }
  .tbtn.primary{background:var(--accent);border-color:transparent;color:#12161A}
  .tspacer{flex:1}
  .progress{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;line-height:1.3}
  .progress button{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0;font-size:12px}

  footer{color:var(--muted);font-size:13px;padding:8px 0 20px;border-top:1px solid var(--line);margin-top:30px}

  @media (max-width:420px){
    h1{font-size:26px}
    .log input{width:76px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  :focus-visible{outline:2px solid var(--run);outline-offset:2px;border-radius:4px}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="head-top">
      <h1>Treino Rafael<span>Academia + 5&nbsp;km · joelho operado de LCA&nbsp;+&nbsp;LCM</span></h1>
      <div class="modeswitch" role="group" aria-label="Dias de academia por semana">
        <button id="m4" aria-pressed="true">4 dias</button>
        <button id="m3" aria-pressed="false">3 dias</button>
      </div>
    </div>
  </div>
  <nav id="nav"></nav>
</header>

<main class="wrap" id="main"></main>

<div class="timerbar">
  <div class="inner">
    <div class="clock" id="clock">1:30</div>
    <button class="tbtn primary" id="tStart">Iniciar</button>
    <button class="tbtn" id="tSet">+30s</button>
    <div class="tspacer"></div>
    <div class="progress">
      <span id="prog">—</span><br>
      <button id="resetDay">limpar marcações</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   DADOS
   ============================================================ */
const YT = (id, t) => `https://www.youtube.com/watch?v=${id}${t?`&t=${t}s`:''}`;
const SEARCH = q => `https://www.youtube.com/results?search_query=${encodeURIComponent(q)}`;

// atalho para criar exercício
const e = (id, nome, sets, video, cues, opts={}) => ({id, nome, sets, video, cues, ...opts});

const DATA = {
  aquecer: {
    label:'Aquecer', cor:'var(--warm)',
    titulo:'Aquecimento — 8 a 10 minutos, antes de todo treino',
    lede:'Três partes: soltar as articulações, acordar glúteo e core, subir a frequência cardíaca. Não pule a parte 2: é ela que protege o joelho operado.',
    blocos:[
      {nome:'1. Mobilidade', sub:'1x15 cada movimento (2x15 se estiver travado)', ex:[
        e('mob-tornozelo','Mobilidade de tornozelo (joelho à parede)','15 cada lado','3pprN9t_P1o',
          ['Pé a ~10 cm da parede, leve o joelho para tocar a parede sem tirar o calcanhar do chão.',
           'É o exercício mais importante da lista para agachar fundo e correr sem sobrecarregar o joelho.',
           'Se um lado vai bem menos longe que o outro, insista mais nesse lado.'],
          {t:{start:16, end:38}, busca:'mobilidade de tornozelo joelho na parede dorsiflexão'}),
        e('mob-9090','Mobilidade de quadril 90/90','10 rotações cada lado','i8Y_v2AWqKc',
          ['Sentado no chão, uma perna à frente e outra ao lado, ambas em 90°.',
           'Gire o quadril alternando os lados mantendo o tronco alto.',
           'Vá até onde não dói. Amplitude vem com semanas, não com força.'],
          {t:{start:370, end:385}, busca:'exercício 90/90 mobilidade de quadril'}),
        e('mob-gato','Gato-camelo','15 repetições','BMdYxIDt5Ys',
          ['Em quatro apoios, alterne arredondar e estender a coluna acompanhando a respiração.',
           'Movimento lento, vértebra por vértebra. Sem impulso.'],
          {t:{start:50, end:72}, busca:'gato camelo mobilidade da coluna como fazer'}),
        e('mob-toracica','Rotação torácica em quatro apoios','10 cada lado','1NCcTlR17rs',
          ['Mão na nuca, gire o tronco abrindo o cotovelo para o teto, olhando para a mão.',
           'O quadril fica parado. A rotação vem da parte de cima das costas.'],
          {busca:'mobilidade torácica rotação quatro apoios'}),
        e('mob-pullapart','Abertura de ombro com elástico (band pull-apart)','15 repetições','XN0J-hI17SU',
          ['Elástico à frente na altura do peito, braços quase estendidos, abra até tocar o peito.',
           'Puxe pelas escápulas, não pelas mãos. Ombros longe das orelhas.'],
          {t:{start:33, end:49}, busca:'band pull apart elástico execução'}),
        e('mob-rotext','Rotação externa de ombro com elástico','15 cada braço','PZPbasPoJQ8',
          ['Cotovelo colado na costela, dobrado em 90°, gire o antebraço para fora contra o elástico.',
           'Elástico leve. Isso é estabilidade do manguito, não é treino de força.'],
          {t:{start:183, end:196}, busca:'rotação externa de ombro com elástico manguito rotador'})
      ]},
      {nome:'2. Ativação com miniband e bola', sub:'o bloco que você já fazia', ex:[
        e('at-abre','Deitado: bola entre os joelhos + miniband nos pés, abre e fecha','2x20','FsmU1SzfMsc',
          ['Deitado de costas, joelhos dobrados, bola apertada entre os joelhos e miniband nos pés.',
           'Abra e feche os pés contra o elástico sem soltar a bola.',
           'Sente o glúteo trabalhando na lateral do quadril, não na lombar.'],
          {busca:'abdução de quadril deitado com mini band joelhos flexionados'}),
        e('at-ponte','Ponte de glúteo com miniband nos joelhos','2x15','q5U-p6vA3uo',
          ['Suba o quadril até alinhar ombro-quadril-joelho, empurrando os joelhos levemente para fora.',
           'Termine apertando o glúteo no topo. Se sentir a lombar, subiu demais.'],
          {t:{start:33, end:68}, busca:'ponte de glúteo com mini band execução correta'}),
        e('at-lateral','Caminhada lateral com miniband','2x10 passos cada lado','jpPCvWQgcSA',
          ['Joelhos semiflexionados, passos curtos e controlados, sem juntar os pés.',
           'Não deixe o joelho cair para dentro em nenhum passo.'],
          {busca:'caminhada lateral com mini band glúteo médio'}),
        e('at-pant','Panturrilha em pé','2x15','Xb-nuSxLVSY',
          ['Suba devagar até a ponta dos pés, desça mais devagar ainda, amplitude total.',
           'A panturrilha é o primeiro amortecedor da corrida. Trate como exercício, não como enfeite.'],
          {t:{start:33, end:52}, busca:'panturrilha em pé execução correta'})
      ]},
      {nome:'3. Cardio leve', sub:'5 minutos', ex:[
        e('at-bike','Bike ou esteira em ritmo leve','5 min','UeK0QVyA4UM',
          ['Ritmo de conversa. Objetivo é aquecer, não cansar.',
           'Se o joelho estiver rígido no dia, bike é melhor escolha que esteira.'],
          {busca:'aquecimento bike ergométrica ritmo leve'})
      ]}
    ]
  },

  forcaA: {
    label:'Força A', cor:'var(--quad)',
    titulo:'Força A — quadríceps e empurrar',
    lede:'Tri-set: faça A1, A2 e A3 em sequência, descanse 90 segundos, repita. 3 a 4 voltas por bloco.',
    blocos:[
      {nome:'Bloco A', sub:'3 a 4 voltas · 90s entre voltas', ex:[
        e('a-agacha','Agachamento (barra, goblet ou hack)','4x6-10','kOgcM3NCYA0',
          ['Desça abaixo da linha do quadril, dentro do que o joelho aceita sem dor.',
           'Joelho na direção da ponta do pé o tempo todo. Nada de joelho caindo para dentro.',
           'Carga progressiva: só sobe quando fecha todas as séries no topo da faixa.'],
          {t:{start:810, end:832}, busca:'agachamento livre com barra execução correta',
           alt:[{n:'Versão goblet (mais fácil de aprender)',v:'HE7JTnLmMxg'},{n:'Versão hack machine',v:'weyTbC-AjRg',t:{start:258}}]}),
        e('a-puxada','Puxada alta ou barra assistida','4x8-12','mPmfwbc_svw',
          ['Puxe levando os cotovelos em direção às costelas, escápulas para baixo.',
           'Sem jogar o tronco para trás para vencer a carga.'],
          {busca:'puxada alta frente pronada execução correta',
           alt:[{n:'Barra fixa assistida no graviton',v:'w0UVe0JAEDQ',t:{start:54}}]}),
        e('a-prancha-lat','Prancha lateral','3x20-40s cada lado','RTxAFDK1OMw',
          ['Cotovelo alinhado com o ombro, corpo em linha reta, quadril alto.',
           'Pare quando a forma quebrar, não quando o tempo acabar.'],
          {t:{start:65, end:91}, busca:'prancha lateral execução correta'})
      ]},
      {nome:'Bloco B', sub:'3 a 4 voltas · 90s entre voltas', ex:[
        e('a-extensora','Cadeira extensora','3x12-15 bilateral + 2x12 cada perna','exLCpU7mT3g',
          ['Encaixe o joelho no eixo da máquina e mantenha o quadril colado no banco.',
           'Se o enxerto foi do tendão quadricipital ou patelar: progrida devagar nos últimos 30° de extensão.',
           'A parte unilateral não é opcional. É ela que mostra e corrige a diferença entre as pernas.'],
          {t:{start:34, end:52}, busca:'cadeira extensora execução correta', uni:true}),
        e('a-supino','Supino reto ou flexão de braço','3-4x8-12','vIGvt-vgrvY',
          ['Escápulas encaixadas no banco, pés firmes no chão, barra descendo na linha do peito.',
           'Cotovelos em ~45° do tronco, não abertos a 90°.'],
          {t:{start:33, end:59}, busca:'supino reto com barra execução correta',
           alt:[{n:'Flexão de braço (push-up)',v:'UkDVBs9GEWo',t:{start:115}}]}),
        e('a-pelvica-uni','Elevação pélvica unilateral','3x12 cada','Sk-mBla2h8A',
          ['Peso do corpo primeiro. Calcanhar sob o joelho, empurre pelo calcanhar.',
           'Quadril sobe nivelado: não deixe um lado ficar mais baixo que o outro.'],
          {t:{start:252, end:265}, busca:'elevação pélvica unilateral 3 dicas', uni:true})
      ]},
      {nome:'Bloco C', sub:'3 voltas', ex:[
        e('a-pant-uni','Panturrilha em pé unilateral','3x12-15 cada','Xb-nuSxLVSY',
          ['Amplitude total: desça o calcanhar abaixo do degrau e suba até o máximo.',
           'Compare os lados. A perna operada quase sempre começa mais fraca aqui.'],
          {t:{start:114, end:132}, busca:'panturrilha unilateral em pé execução', uni:true}),
        e('a-elev-lat','Elevação lateral de ombro','3x12-15','jannLx4RxKo',
          ['Suba até a linha dos ombros, sem impulso de tronco.',
           'Carga leve funciona melhor que carga pesada aqui.'],
          {t:{start:19, end:35}, busca:'elevação lateral com halteres técnica correta'}),
        e('a-deadbug','Dead bug (ou abdominal à escolha)','3x10-12','0loS0bRNqfs',
          ['Lombar colada no chão do começo ao fim. Se descolou, reduza a amplitude.',
           'Estenda braço e perna opostos devagar, expirando.'],
          {t:{start:53, end:76}, busca:'dead bug exercício core execução correta'})
      ]},
      {nome:'Finalizador', sub:'2 a 3 voltas — o combo que você gosta', ex:[
        e('a-fin-1','Bola entre os joelhos + miniband, abre e fecha','20','FsmU1SzfMsc',
          ['Mesma execução do aquecimento, agora com a perna já cansada.'],
          {busca:'abdução de quadril deitado mini band'}),
        e('a-fin-2','Flexão de braço','10','UkDVBs9GEWo',
          ['Corpo em prancha, desça até o peito quase tocar o chão.','Joelhos apoiados se a forma quebrar.'],
          {t:{start:115, end:130}, busca:'flexão de braço push up execução correta'}),
        e('a-fin-3','Agachamento peso do corpo','20','CaTbpJH49i4',
          ['Ritmo contínuo e controlado, sem travar o joelho no topo.'],
          {t:{start:117, end:136}, busca:'agachamento livre peso do corpo passo a passo iniciantes'}),
        e('a-fin-4','Equilíbrio em uma perna','30s cada','5OKF9DJcP6M',

/* ============================================================
   ARMAZENAMENTO (usa window.storage quando existir)
   ============================================================ */
const mem = {};
const store = {
  async get(k){
    try{ if(window.storage){ const r = await window.storage.get(k); return r ? r.value : (mem[k] ?? null); } }
    catch(_){}
    return mem[k] ?? null;
  },
  async set(k,v){
    mem[k]=v;
    try{ if(window.storage) await window.storage.set(k,v); }catch(_){}
  }
};

function render(){
  const s = DATA[atual];
  document.documentElement.style.setProperty('--accent', s.cor);
  nav.querySelectorAll('button').forEach(b=>{
    const on = b.dataset.k===atual;
    b.setAttribute('aria-current', on);
    b.style.setProperty('--tabcol', DATA[b.dataset.k].cor);
  });

  let body;
  if(s.custom==='corrida') body = corridaHTML();
  else if(s.custom==='guia') body = guiaHTML();
  else body = (atual==='aquecer'? '' : semanaHTML()) + blocosHTML(s);

  main.innerHTML = `
    <div class="panel on">
      <h2>${esc(s.titulo)}</h2>
      ${s.lede?`<p class="lede">${esc(s.lede)}</p>`:''}
      ${body}
      ${s.depois==='danger'?`<div class="note danger"><strong>Saltos e pliometria:</strong> só entram se o fisio liberar e se a perna operada tiver pelo menos 90% da força e do salto unipodal da perna boa.</div>`:''}
      <footer>Vídeos abrem no YouTube. Se algum sair do ar, use "Outros vídeos" — a busca já vem com o nome técnico do exercício.</footer>
    </div>`;

  restaurar();
  atualizaProgresso();
  window.scrollTo({top:0});
}

  s.onerror = ()=>{ ytFalhou = true; };
  document.head.appendChild(s);
  setTimeout(()=>{ if(!ytPronto) ytFalhou = true; }, 3000);
})();
window.onYouTubeIframeAPIReady = ()=>{ ytPronto = true; };

function pausarOutros(atual){
  players.forEach(p=>{
    if(p !== atual && p && typeof p.pauseVideo === 'function'){
      try{ p.pauseVideo(); }catch(_){}
    }
  });
}

function iframeSimples(el, id, ini, fim){
  // nada de enablejsapi aqui: exige origem válida e quebra em file:// (erro 153)
  const q = ['rel=0','modestbranding=1','playsinline=1','autoplay=1'];
  if(ini != null) q.push('start=' + ini);
  if(fim != null) q.push('end=' + fim);
  // loop sem a API depende de playlist=, que também precisa de origem válida
  if(!LOCAL && ini != null && fim != null) q.push('loop=1', 'playlist=' + id);
  el.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?${q.join('&')}" allow="accelerometer;autoplay;encrypted-media;gyroscope;picture-in-picture" allowfullscreen title="Execução do exercício"></iframe>`;
}

function criarPlayer(el, id, ini, fim){
  const host = document.createElement('div');
  el.innerHTML = ''; el.appendChild(host);
  const vars = {rel:0, modestbranding:1, playsinline:1, autoplay:1};
  if(ini != null) vars.start = ini;
  if(fim != null) vars.end   = fim;
  const p = new YT.Player(host, {
    videoId:id, playerVars:vars,
    events:{
      onReady: ev=>{ pausarOutros(p); try{ ev.target.playVideo(); }catch(_){} },
      onStateChange: ev=>{
        if(ev.data === YT.PlayerState.ENDED && ini != null){
          try{ ev.target.seekTo(ini, true); ev.target.playVideo(); }catch(_){}
        }
      },
      onError: ()=> iframeSimples(el, id, ini, fim)
    }
  });
  players.push(p);
  // cão-de-guarda: se o ENDED não disparar, volta ao início do trecho
  if(ini != null && fim != null){
    setInterval(()=>{
      try{
        if(typeof p.getCurrentTime !== 'function') return;
        if(p.getCurrentTime() >= fim + 0.4){ p.seekTo(ini, true); p.playVideo(); }
      }catch(_){}
    }, 500);
  }
}

function abrirVideo(el){
  const id  = el.dataset.video;
  const ini = el.dataset.start ? +el.dataset.start : null;
  const fim = el.dataset.end   ? +el.dataset.end   : null;
  if(LOCAL){
    el.dataset.on = '';                  // deixa clicar de novo
    window.open(YT(id, ini), '_blank', 'noopener');
    return;
  }
  if(ytPronto && window.YT && window.YT.Player) return criarPlayer(el, id, ini, fim);
  if(ytFalhou) return iframeSimples(el, id, ini, fim);
  const t0 = Date.now();
  const iv = setInterval(()=>{
    if(ytPronto && window.YT && window.YT.Player){ clearInterval(iv); criarPlayer(el, id, ini, fim); }
    else if(ytFalhou || Date.now()-t0 > 3000){ clearInterval(iv); iframeSimples(el, id, ini, fim); }
  }, 100);
}

main.addEventListener('click', ev=>{
  const tick = ev.target.closest('[data-tick]');
  const top  = ev.target.closest('.ex-top');
  const vid  = ev.target.closest('[data-video]');

  if(tick){
    ev.stopPropagation();
    const ex = tick.closest('.ex');
    ex.classList.toggle('done');
    salvarFeitos();
    atualizaProgresso();
    if(ex.classList.contains('done')) iniciarTimer();
    return;
  }
  if(top){
    const ex = top.closest('.ex');
    const open = ex.classList.toggle('open');
    top.setAttribute('aria-expanded', open);
    return;
  }
  if(vid && !vid.dataset.on){
    vid.dataset.on = '1';
    abrirVideo(vid);
    return;
  }
});

main.addEventListener('input', ev=>{
  const inp = ev.target.closest('[data-log]');
  if(!inp) return;
  clearTimeout(inp._t);
  inp._t = setTimeout(async ()=>{
    const cargas = JSON.parse(await store.get('cargas') || '{}');
    cargas[inp.dataset.log] = inp.value;
    await store.set('cargas', JSON.stringify(cargas));
    const s = main.querySelector(`[data-saved="${inp.dataset.log}"]`);
    if(s){ s.classList.add('on'); setTimeout(()=>s.classList.remove('on'), 1200); }
  }, 450);
});

async function salvarFeitos(){
  const feitos = JSON.parse(await store.get('feitos') || '{}');
  main.querySelectorAll('.ex').forEach(ex=>{
    if(ex.classList.contains('done')) feitos[ex.dataset.id]=1;
    else delete feitos[ex.dataset.id];
  });
  await store.set('feitos', JSON.stringify(feitos));
}

async function restaurar(){
  const feitos = JSON.parse(await store.get('feitos') || '{}');
  const cargas = JSON.parse(await store.get('cargas') || '{}');
  main.querySelectorAll('.ex').forEach(ex=>{
    if(feitos[ex.dataset.id]) ex.classList.add('done');
  });
  main.querySelectorAll('[data-log]').forEach(i=>{
    if(cargas[i.dataset.log]) i.value = cargas[i.dataset.log];
  });
  atualizaProgresso();
}

function atualizaProgresso(){
  const all = main.querySelectorAll('.ex');
  const el = document.getElementById('prog');
  if(!all.length){ el.textContent='—'; return; }
  const feito = main.querySelectorAll('.ex.done').length;
  el.textContent = `${feito} de ${all.length} feitos`;
}

document.getElementById('resetDay').onclick = async ()=>{
  main.querySelectorAll('.ex.done').forEach(x=>x.classList.remove('done'));
  await salvarFeitos();
  atualizaProgresso();
};

/* ---------- timer de descanso ---------- */
let alvo = 90, restante = 90, tick = null;
const clock = document.getElementById('clock');
const btnStart = document.getElementById('tStart');

function fmt(s){ const m=Math.floor(s/60); return `${m}:${String(s%60).padStart(2,'0')}`; }
function pinta(){ clock.textContent = fmt(Math.max(0,restante)); }

function iniciarTimer(){
  clearInterval(tick);
  restante = alvo; pinta();
  clock.classList.remove('ring');
  btnStart.textContent = 'Zerar';
  tick = setInterval(()=>{
    restante--; pinta();
    if(restante<=0){
      clearInterval(tick); tick=null;
      clock.classList.add('ring');
      btnStart.textContent='Iniciar';
      if(navigator.vibrate) navigator.vibrate([120,80,120]);
    }
  },1000);
}
btnStart.onclick = ()=>{
  if(tick){ clearInterval(tick); tick=null; restante=alvo; pinta(); btnStart.textContent='Iniciar'; clock.classList.remove('ring'); }
  else iniciarTimer();
};
document.getElementById('tSet').onclick = ()=>{
  alvo = alvo>=180 ? 60 : alvo+30;
  document.getElementById('tSet').textContent = alvo>=180 ? 'voltar 60s' : '+30s';
  if(!tick){ restante = alvo; pinta(); }
};
pinta();

/* ---------- boot ---------- */
(async ()=>{
  const m = await store.get('modo');
  if(m==='3'){ modo=3; }
  document.getElementById('m4').setAttribute('aria-pressed', modo===4);
  document.getElementById('m3').setAttribute('aria-pressed', modo===3);
  render();
})();
</script>
