<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover é o que faz env(safe-area-inset-*) valer alguma coisa
         no iPhone; sem ele o sheet encosta no indicador de home. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Plano de treino de força e corrida: 8 divisões, 53 exercícios e 40 recortes de vídeo no segundo exato da execução correta."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FCFAF5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#211E1A" />
    <title>Protocolo de treino — Rafael</title>
    <!-- O escuro é primeira classe, não afterthought: papel puro a 100% de
         brilho num canto escuro da academia às 22h machuca. A classe do tema
         precisa estar no <html> ANTES do primeiro paint — o useTema do React só
         roda depois de baixar e avaliar o bundle, e até lá a tela seria branca.
         Bloqueante e minúsculo de propósito; falha em silêncio se o storage
         estiver bloqueado (modo privado), caindo no que o sistema pedir. -->
    <script>
      ;(function () {
        try {
          var tema = localStorage.getItem('treino.tema') || 'auto'
          var escuro =
            tema === 'escuro' ||
            (tema !== 'claro' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          var raiz = document.documentElement
          raiz.classList.add(escuro ? 'escuro' : 'claro')
          raiz.style.colorScheme = tema === 'auto' ? 'light dark' : escuro ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
